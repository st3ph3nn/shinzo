<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flappy Bird</title>
<style>
  html, body { height: 100%; margin: 0; background: #1d2b3a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    height: min(100vh, 150vw); aspect-ratio: 2 / 3; max-width: 100vw;
    display: block; touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: 0 0 40px rgba(0, 0, 0, .5); cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Flappy Bird game. Press space, click or tap to flap."></canvas>

<script>
(() => {
  const W = 400, H = 600, GROUND = 90;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // ---- Tunables (per 60fps frame) ----
  const GRAVITY = 0.5, FLAP = -7.6, SPEED = 2.6;
  const PIPE_W = 62, GAP = 150, PIPE_EVERY = 210;
  const BIRD_X = 100, BIRD_R = 13;

  // ---- State ----
  let state = 'ready';            // ready | playing | over
  let bird, pipes, clouds, score, best = 0, groundX = 0, flapT = 0, overAt = 0, flash = 0, muted = false;

  try { best = +localStorage.getItem('flappy-best') || 0; } catch (e) {}

  function reset() {
    bird = { y: H / 2 - 30, v: 0, rot: 0 };
    pipes = []; score = 0; flash = 0;
    if (!clouds) {
      clouds = Array.from({ length: 5 }, (_, i) => ({
        x: i * 100, y: 40 + Math.random() * 220, s: 0.6 + Math.random() * 0.8
      }));
    }
  }

  // ---- Sound ----
  let actx;
  function tone(f1, f2, dur, type = 'square', vol = 0.08) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // ---- Input ----
  function flap() {
    if (state === 'ready') { state = 'playing'; }
    if (state === 'playing') {
      bird.v = FLAP; flapT = 0;
      tone(420, 700, 0.12);
    } else if (state === 'over' && performance.now() - overAt > 450) {
      reset(); state = 'ready';
    }
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM') { muted = !muted; return; }
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) flap(); }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  // ---- Update ----
  function die() {
    state = 'over'; overAt = performance.now(); flash = 1;
    tone(220, 50, 0.35, 'sawtooth', 0.12);
    if (score > best) {
      best = score;
      try { localStorage.setItem('flappy-best', best); } catch (e) {}
    }
  }

  function update(dt) {
    // Clouds always drift
    clouds.forEach(c => { c.x -= 0.25 * c.s * dt; if (c.x < -90) { c.x = W + 20; c.y = 40 + Math.random() * 220; } });
    if (flash > 0) flash = Math.max(0, flash - 0.06 * dt);

    if (state === 'over') {
      // Let the bird fall to the ground
      if (bird.y < H - GROUND - BIRD_R) { bird.v += GRAVITY * dt; bird.y += bird.v * dt; bird.rot = Math.min(bird.rot + 0.12 * dt, 1.5); }
      else bird.y = H - GROUND - BIRD_R;
      return;
    }

    groundX = (groundX - SPEED * dt) % 24;
    flapT += dt;

    if (state === 'ready') {
      bird.y = H / 2 - 30 + Math.sin(performance.now() / 220) * 8;
      bird.rot = 0;
      return;
    }

    // Bird physics
    bird.v += GRAVITY * dt;
    bird.y += bird.v * dt;
    bird.rot = Math.max(-0.45, Math.min(bird.v * 0.075, 1.3));

    // Pipes
    const last = pipes[pipes.length - 1];
    if (!last || last.x < W - PIPE_EVERY) {
      pipes.push({ x: W + 10, gapY: 130 + Math.random() * (H - GROUND - 260), passed: false });
    }
    pipes.forEach(p => {
      p.x -= SPEED * dt;
      if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) {
        p.passed = true; score++;
        tone(880, 1320, 0.12, 'triangle', 0.1);
      }
    });
    pipes = pipes.filter(p => p.x > -PIPE_W - 10);

    // Collisions
    if (bird.y + BIRD_R >= H - GROUND) { bird.y = H - GROUND - BIRD_R; return die(); }
    if (bird.y - BIRD_R <= 0) { bird.y = BIRD_R; bird.v = 0; }
    for (const p of pipes) {
      if (BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W) {
        if (bird.y - BIRD_R < p.gapY - GAP / 2 || bird.y + BIRD_R > p.gapY + GAP / 2) return die();
      }
    }
  }

  // ---- Drawing ----
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H - GROUND);
    g.addColorStop(0, '#4ec0ca'); g.addColorStop(1, '#bfeaf0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.85)';
    clouds.forEach(c => {
      const r = 18 * c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, 7); ctx.arc(c.x + r * 1.2, c.y - r * 0.5, r * 1.2, 0, 7);
      ctx.arc(c.x + r * 2.5, c.y, r, 0, 7); ctx.rect(c.x, c.y, r * 2.5, r);
      ctx.fill();
    });

    // City silhouette
    ctx.fillStyle = '#a5dfe3';
    for (let i = 0; i < 9; i++) {
      const bw = 48, bh = 40 + ((i * 37) % 55);
      ctx.fillRect(i * bw - 10, H - GROUND - bh, bw - 6, bh);
    }
    ctx.fillStyle = '#8fd4b0';
    ctx.beginPath(); ctx.moveTo(0, H - GROUND);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - GROUND - 14 - Math.sin(x * 0.05) * 10);
    ctx.lineTo(W, H - GROUND); ctx.fill();
  }

  function drawPipe(p) {
    const capH = 26, capX = p.x - 4, capW = PIPE_W + 8;
    const top = p.gapY - GAP / 2, bot = p.gapY + GAP / 2;
    const g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    g.addColorStop(0, '#5ea82a'); g.addColorStop(0.35, '#a6e05a'); g.addColorStop(1, '#4c8c1f');
    const seg = (x, y, w, h) => {
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#2f5a12'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
    };
    seg(p.x, 0, PIPE_W, top - capH);            seg(capX, top - capH, capW, capH);
    seg(p.x, bot + capH, PIPE_W, H - GROUND - bot - capH); seg(capX, bot, capW, capH);
  }

  function drawGround() {
    const y = H - GROUND;
    ctx.fillStyle = '#ded895'; ctx.fillRect(0, y, W, GROUND);
    ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, y, W, 16);
    ctx.fillStyle = '#9ce659';
    for (let x = groundX - 24; x < W + 24; x += 24) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 12, y); ctx.lineTo(x + 24, y + 16); ctx.lineTo(x + 12, y + 16); ctx.fill();
    }
    ctx.fillStyle = '#2f5a12'; ctx.fillRect(0, y, W, 3);
    ctx.fillStyle = '#c9c078'; ctx.fillRect(0, y + 16, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y); ctx.rotate(bird.rot);
    // body
    ctx.fillStyle = '#f7d23e'; ctx.strokeStyle = '#4a3410'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, 7); ctx.fill(); ctx.stroke();
    // belly
    ctx.fillStyle = '#fbeaa0';
    ctx.beginPath(); ctx.ellipse(-2, 5, 10, 6, 0, 0, 7); ctx.fill();
    // wing (flaps while playing)
    const wy = state === 'over' ? 3 : Math.sin((state === 'ready' ? performance.now() / 60 : flapT * 0.7)) * 5;
    ctx.fillStyle = '#e8a91e';
    ctx.beginPath(); ctx.ellipse(-6, 2 + wy * 0.4, 9, 5.5, -0.2 + wy * 0.05, 0, 7); ctx.fill(); ctx.stroke();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(8, -5, 5.5, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(10, -5, 2.2, 0, 7); ctx.fill();
    // beak
    ctx.fillStyle = '#f0603a';
    ctx.beginPath(); ctx.ellipse(16, 4, 8, 4.5, 0.1, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function text(str, x, y, size, fill = '#fff', align = 'center') {
    ctx.font = `900 ${size}px "Arial Black", Impact, "Helvetica Neue", sans-serif`;
    ctx.textAlign = align; ctx.lineJoin = 'round';
    ctx.lineWidth = size / 5; ctx.strokeStyle = '#3b2a10'; ctx.strokeText(str, x, y);
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }

  function drawOverlay() {
    if (state === 'playing') { text(score, W / 2, 90, 56); return; }
    if (state === 'ready') {
      text('Flappy Bird', W / 2, 130, 42, '#fbe26b');
      text('Get ready', W / 2, 330, 24);
      text('Tap, click or press Space to flap', W / 2, 362, 14);
      return;
    }
    // Game over panel
    text('Game over', W / 2, 150, 40, '#f0603a');
    ctx.fillStyle = '#ded895'; ctx.strokeStyle = '#3b2a10'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(W / 2 - 110, 190, 220, 130, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a5a20'; ctx.font = '700 14px Arial, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Score', W / 2 - 90, 225); ctx.fillText('Best', W / 2 - 90, 280);
    text(score, W / 2 + 90, 232, 32, '#fff', 'right');
    text(best, W / 2 + 90, 288, 32, score >= best && score > 0 ? '#fbe26b' : '#fff', 'right');
    if (performance.now() - overAt > 450) text('Tap to play again', W / 2, 380, 20);
  }

  function draw() {
    drawSky();
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();
    drawOverlay();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---- Loop ----
  reset();
  let prev = performance.now();
  function loop(now) {
    const dt = Math.min((now - prev) / 16.667, 2.5);
    prev = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
